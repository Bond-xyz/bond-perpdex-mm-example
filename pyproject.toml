[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-perpdex-mm-example"
version = "0.1.0"
description = "Offline-first, testnet-only BondPerpDex Python integration example"
requires-python = ">=3.12"
dependencies = [
  "eth-account==0.13.7",
  "cryptography==46.0.5",
  "httpx==0.28.1",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[tool.setuptools.package-data]
bond_perpdex_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
